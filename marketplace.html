<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace - FOR Magical Use Only</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header>
        <h1>Marketplace</h1>
    </header>
    <nav>
        <a href="index.html" title="Home"><i class="fas fa-home"></i></a>
        <a href="aboutthemagic.html" title="About"><i class="fas fa-info-circle"></i></a>
        <a href="gallery.html" title="Gallery"><i class="fas fa-images"></i></a>
        <a href="marketplace.html" title="Shop"><i class="fas fa-shopping-cart"></i></a>
        <a href="tours.html" title="Tours"><i class="fas fa-map-marked-alt"></i></a>
        <a href="support.html" title="Support"><i class="fas fa-heart"></i></a>
        <a href="draw.html" title="Draw"><i class="fas fa-pencil-alt"></i></a>
        <a href="tarot.html" title="Tarot"><i class="fas fa-book-open"></i></a>
        <a href="contact.html" title="Contact"><i class="fas fa-envelope"></i></a>
    </nav>
    <section class="marketplace-section" id="marketplace-container">
        <!-- Products will be dynamically inserted here -->
    </section>
    <footer>
        <p>&copy; 2025 FOR Magical Use Only. Crafted in Slab City’s dust.</p>
    </footer>
    <script src="https://js.stripe.com/v3/"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const stripe = Stripe('pk_live_51P3Z5yRxKIpEa9z2e3hVj0oMOq40S3nK1gWqWjOr3a2wEV2kRr5e5PA3mjaqYkFp2DkS44tYgNn581ywhaCAc6ca00b0TFEuGq');
            const marketplaceContainer = document.getElementById('marketplace-container');

            try {
                const response = await fetch('/api/contentful?content_type=NVpVj8LwkehFy7TfbDiCu');
                const data = await response.json();

                data.items.forEach(item => {
                    const product = document.createElement('div');
                    product.classList.add('product');

                    const productName = document.createElement('h2');
                    productName.textContent = item.fields.productName;
                    product.appendChild(productName);

                    const productDescription = document.createElement('p');
                    productDescription.textContent = item.fields.productDescription;
                    product.appendChild(productDescription);

                    const mediaAsset = data.includes.Asset.find(asset => asset.sys.id === item.fields.productImage.sys.id);
                    if (mediaAsset) {
                        const fileType = mediaAsset.fields.file.contentType;
                        if (fileType.startsWith('video')) {
                            const productVideo = document.createElement('video');
                            productVideo.src = 'https:' + mediaAsset.fields.file.url;
                            productVideo.autoplay = true;
                            productVideo.loop = true;
                            productVideo.muted = true; // Necessary for autoplay in most browsers
                            productVideo.playsInline = true;
                            productVideo.classList.add('product-media');
                            product.appendChild(productVideo);
                        } else if (fileType.startsWith('image')) {
                            const productImage = document.createElement('img');
                            productImage.src = 'https:' + mediaAsset.fields.file.url;
                            productImage.alt = mediaAsset.fields.title;
                            productImage.classList.add('product-media');
                            product.appendChild(productImage);
                        }
                    }

                    const price = document.createElement('div');
                    price.classList.add('price');
                    price.textContent = 'Loading price...';
                    product.appendChild(price);

                    // Fetch the price from our secure API
                    if (item.fields.stripePriceId) {
                        fetch(`/api/get-stripe-price?priceId=${item.fields.stripePriceId}`)
                            .then(res => res.json())
                            .then(priceData => {
                                if (priceData.unit_amount) {
                                    const amount = (priceData.unit_amount / 100).toLocaleString('en-US', {
                                        style: 'currency',
                                        currency: priceData.currency || 'USD',
                                    });
                                    price.textContent = amount;
                                } else {
                                    price.textContent = 'Price unavailable';
                                }
                            })
                            .catch(() => price.textContent = 'Error loading price');
                    } else {
                        price.textContent = 'Not for sale';
                    }

                    const buyButton = document.createElement('button');
                    buyButton.classList.add('buy-button');
                    buyButton.textContent = 'Buy Now';
                    buyButton.addEventListener('click', async () => {
                        try {
                            const response = await fetch('/api/create-checkout-session', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                },
                                body: JSON.stringify({
                                    priceId: item.fields.stripePriceId,
                                    successUrl: `${window.location.origin}/order-success.html`,
                                    cancelUrl: `${window.location.origin}/order-cancel.html`,
                                }),
                            });

                            const { sessionId, error } = await response.json();

                            if (error) {
                                throw new Error(error);
                            }

                            const { error: stripeError } = await stripe.redirectToCheckout({ sessionId });

                            if (stripeError) {
                                alert(stripeError.message);
                            }
                        } catch (error) {
                            console.error('Checkout error:', error);
                            alert('Failed to initiate checkout. Please try again.');
                        }
                    });
                    product.appendChild(buyButton);

                    marketplaceContainer.appendChild(product);
                });
            } catch (error) {
                console.error('Failed to load marketplace products:', error);
            }
        });
    </script>
</body>
</html>
